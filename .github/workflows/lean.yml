name: Lean

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (kernel-checks all certificates and proofs)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
      - name: Axiom audit (no sorry, no native_decide)
        working-directory: lean
        run: |
          lake env lean Audit.lean | tee audit.txt
          ! grep -E 'sorryAx|ofReduceBool|ofReduceNat' audit.txt
      - name: Certificates match the data files
        run: |
          python3 code/make_lean.py
          git diff --exit-code lean/BalancedLatin/Certificates lean/BalancedLatin/Certificates.lean
